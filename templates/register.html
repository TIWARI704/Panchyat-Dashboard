<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchayat Dashboard - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>Create Account</h1>
            <p>Register for Panchayat Dashboard</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'error' if category == 'error' else 'success' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login.register') }}" method="POST">
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label for="user_role">User Role *</label>
                <select id="user_role" name="user_role" required>
                    <option value="user">Regular User (Can add records only)</option>
                    <option value="admin">Admin (Can add records and view dashboard)</option>
                    <option value="superadmin">Super Admin (Can add, edit, and delete records)</option>
                </select>
            </div>

            <button type="submit" class="register-btn">Register</button>
        </form>

        <div class="login-link">
            <a href="{{ url_for('login.login') }}">Already have an account? Login here</a>
        </div>
    </div>
</body>
</html>
