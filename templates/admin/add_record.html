{% extends "admin/base.html" %}

{% block title %}Add Record - Panchayat Management{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0 text-gray-800">Add New Record</h1>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card shadow">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Record Information</h6>
                </div>
                <div class="card-body">
                    <form method="POST" id="addRecordForm">
                        <!-- Scheme Selection -->
                        <div class="row">
                            <div class="col-12 mb-3">
                                <label for="scheme_id" class="form-label">Select Scheme *</label>
                                <select class="form-control" id="scheme_id" name="scheme_id" required>
                                    <option value="">Select a scheme</option>
                                    <!-- Options will be loaded dynamically -->
                                </select>
                            </div>
                        </div>

                        <!-- Dynamic Form Fields Container -->
                        <div id="dynamicFieldsContainer">
                            <div class="text-center text-muted py-4">
                                <i class="fas fa-info-circle fa-2x mb-2"></i>
                                <p>Please select a scheme to see the form fields.</p>
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="row mt-4">
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary" id="submitBtn" disabled>
                                    <i class="fas fa-save"></i> Add Record
                                </button>
                                <button type="button" class="btn btn-secondary" id="resetBtn">
                                    <i class="fas fa-undo"></i> Reset Form
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const schemeSelect = document.getElementById('scheme_id');
    const dynamicFieldsContainer = document.getElementById('dynamicFieldsContainer');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    
    let currentSchemeId = null;
    
    // Load available schemes
    loadAvailableSchemes();
    
    // Handle scheme selection change
    schemeSelect.addEventListener('change', function() {
        const selectedSchemeId = this.value;
        if (selectedSchemeId) {
            loadSchemeFields(selectedSchemeId);
        } else {
            clearDynamicFields();
        }
    });
    
    // Handle reset button
    resetBtn.addEventListener('click', function() {
        resetForm();
    });
    
    
    function loadAvailableSchemes() {
        fetch('/admin/api/schemes-for-user-creation')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Clear existing options
                    schemeSelect.innerHTML = '<option value="">Select a scheme</option>';
                    
                    // Group schemes by department
                    const groupedSchemes = {};
                    data.schemes.forEach(scheme => {
                        const deptName = scheme.department_name;
                        if (!groupedSchemes[deptName]) {
                            groupedSchemes[deptName] = [];
                        }
                        groupedSchemes[deptName].push(scheme);
                    });
                    
                    // Add optgroups and options
                    Object.keys(groupedSchemes).forEach(deptName => {
                        const optgroup = document.createElement('optgroup');
                        optgroup.label = deptName;
                        
                        groupedSchemes[deptName].forEach(scheme => {
                            const option = document.createElement('option');
                            option.value = scheme.id;
                            option.textContent = scheme.name;
                            optgroup.appendChild(option);
                        });
                        
                        schemeSelect.appendChild(optgroup);
                    });
                } else {
                    console.error('Error loading schemes:', data.message);
                }
            })
            .catch(error => {
                console.error('Error loading schemes:', error);
            });
    }
    
    function loadSchemeFields(schemeId) {
        currentSchemeId = schemeId;
        
        // Show loading state
        dynamicFieldsContainer.innerHTML = `
            <div class="text-center py-4">
                <div class="spinner-border text-primary" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
                <p class="mt-2 text-muted">Loading form fields...</p>
            </div>
        `;
        
        // Fetch scheme form fields
        fetch(`/admin/api/scheme-form-fields/${schemeId}`)
            .then(response => {
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    renderDynamicFields(data.form_fields, data.scheme_name, data.department_name);
                    submitBtn.disabled = false;
                } else {
                    showError(data.message);
                }
            })
            .catch(error => {
                console.error('Error loading scheme fields:', error);
                showError('Error loading form fields. Please try again.');
            });
    }
    
    function renderDynamicFields(formFields, schemeName, departmentName) {
        if (!formFields || formFields.length === 0) {
            dynamicFieldsContainer.innerHTML = `
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    No specific fields defined for this scheme. You can add basic information.
                </div>
            `;
            return;
        }
        
        let html = '';
        
        // Start first row
        html += '<div class="row">';
        
        formFields.forEach((field, index) => {
            const fieldId = `field_${field.name}`;
            const required = field.required ? 'required' : '';
            const requiredStar = field.required ? ' *' : '';
            
            html += `<div class="col-md-6 mb-3">
                <label for="${fieldId}" class="form-label">${field.label}${requiredStar}</label>`;
            
            if (field.type === 'enum' && field.options && field.options.length > 0) {
                // Dropdown for enum fields
                html += `<select class="form-control" id="${fieldId}" name="${field.name}" ${required}>`;
                html += `<option value="">Select ${field.label}</option>`;
                field.options.forEach(option => {
                    html += `<option value="${option}">${option}</option>`;
                });
                html += `</select>`;
            } else if (field.type === 'date') {
                // Date input
                html += `<input type="date" class="form-control" id="${fieldId}" name="${field.name}" ${required}>`;
            } else if (field.type === 'int') {
                // Integer input
                html += `<input type="number" class="form-control" id="${fieldId}" name="${field.name}" step="1" ${required}>`;
            } else if (field.type === 'float') {
                // Float input
                html += `<input type="number" class="form-control" id="${fieldId}" name="${field.name}" step="0.01" ${required}>`;
            } else if (field.type === 'boolean') {
                // Boolean input (checkbox)
                html += `<div class="form-check">
                    <input type="checkbox" class="form-check-input" id="${fieldId}" name="${field.name}" value="true">
                    <label class="form-check-label" for="${fieldId}">Yes</label>
                </div>`;
            } else {
                // Text input (default)
                html += `<input type="text" class="form-control" id="${fieldId}" name="${field.name}" ${required}>`;
            }
            
            html += `</div>`;
            
            // Close current row and start new row after every 2 fields
            if ((index + 1) % 2 === 0 && index < formFields.length - 1) {
                html += '</div><div class="row">';
            }
        });
        
        // Close the last row
        html += '</div>';
        
        dynamicFieldsContainer.innerHTML = html;
    }
    
    function showError(message) {
        dynamicFieldsContainer.innerHTML = `
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-triangle"></i>
                ${message}
            </div>
        `;
        submitBtn.disabled = true;
    }
    
    function clearDynamicFields() {
        dynamicFieldsContainer.innerHTML = `
            <div class="text-center text-muted py-4">
                <i class="fas fa-info-circle fa-2x mb-2"></i>
                <p>Please select a scheme to see the form fields.</p>
            </div>
        `;
        submitBtn.disabled = true;
        currentSchemeId = null;
    }
    
    function resetForm() {
        // Clear all dynamic fields
        clearDynamicFields();
        
        // Reset scheme selection
        schemeSelect.value = '';
        
        // Reset the entire form
        const form = document.getElementById('addRecordForm');
        form.reset();
        
        // Clear any existing alerts
        const existingAlerts = form.querySelectorAll('.alert');
        existingAlerts.forEach(alert => alert.remove());
        
        // Show success message
        const alert = document.createElement('div');
        alert.className = 'alert alert-success alert-dismissible fade show';
        alert.innerHTML = `
            <i class="fas fa-check-circle"></i>
            Form has been reset. Please select a scheme to continue.
            <button type="button" class="close" data-dismiss="alert">
                <span>&times;</span>
            </button>
        `;
        
        // Insert alert at the top of the form
        form.insertBefore(alert, form.firstChild);
        
        // Auto-dismiss alert after 3 seconds
        setTimeout(() => {
            if (alert.parentNode) {
                alert.remove();
            }
        }, 3000);
    }
});
</script>
{% endblock %}
