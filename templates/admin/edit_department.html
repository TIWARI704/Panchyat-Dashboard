{% extends "admin/base.html" %}

{% block title %}Edit Department - Panchayat Management{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Edit Department</h2>
    <a href="{{ url_for('admin.manage_departments') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-left me-2"></i>Back to Departments
    </a>
</div>

<div class="card">
    <div class="card-header">
        <h5 class="mb-0">Department Details</h5>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin.edit_department', department_id=department._id) }}">
            <div class="mb-3">
                <label for="name" class="form-label">Department Name *</label>
                <input type="text" class="form-control" id="name" name="name" 
                       value="{{ department.name }}" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ department.description or '' }}</textarea>
            </div>
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="is_active" name="is_active" 
                           {% if department.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">
                        Active
                    </label>
                </div>
            </div>
            <div class="text-end">
                <a href="{{ url_for('admin.manage_departments') }}" class="btn btn-secondary me-2">Cancel</a>
                <button type="submit" class="btn btn-primary">Update Department</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
